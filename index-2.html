<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVEN NURSES — Student & Admin Portal</title>
<style>
:root{--green:#006b4f;--green2:#07845f;--navy:#12345b;--bg:#f2f7f8;--text:#17324d;--muted:#718399;--border:#dce7ed;--red:#dc3545;--yellow:#f4b400;--blue:#1479e8}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:650;transition:.15s}button:hover{filter:brightness(.96);transform:translateY(-1px)}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.topbar{height:94px;flex:0 0 94px;background:linear-gradient(165deg,#00523f 0%,#007653 72%,#13936c 100%);color:white;display:flex;align-items:center;gap:14px;padding:0 5.5%;box-shadow:0 3px 12px #092d2b22;z-index:5;position:relative;border-radius:0 0 38% 5% / 0 0 18% 8%}
.brandmark{height:58px;width:58px;border:3px solid #e6fff4;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#ffffff15;flex:0 0 auto;overflow:hidden}.brandmark img{width:100%;height:100%;object-fit:cover}.brand{font-weight:850;letter-spacing:.3px;font-size:24px;line-height:1.1}.brand small{display:block;font-size:13px;font-weight:500;letter-spacing:.2px;opacity:.95;margin-top:5px}.top-spacer{flex:1}.top-pill{border:1px solid #ffffff55;border-radius:20px;padding:8px 12px;font-size:12px}.avatar{width:32px;height:32px;background:#d8eee6;color:#07583f;border-radius:50%;display:grid;place-items:center;font-weight:800}
.workspace{display:flex;min-height:0;flex:1}.sidebar{width:230px;flex:0 0 230px;background:#073f3c;color:#d9eeeb;display:flex;flex-direction:column;transition:width .2s,flex-basis .2s;overflow:hidden}.sidebar.closed{width:0;flex-basis:0}.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px;color:#a8d7cb;font-size:11px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}.close-side{padding:5px 8px;color:white;background:#ffffff20;font-size:17px}.nav{padding:4px 9px;display:grid;gap:5px}.nav button{color:#d5eae7;background:transparent;text-align:left;display:flex;gap:12px;align-items:center;white-space:nowrap;padding:12px 13px;font-size:13px}.nav button.active,.nav button:hover{background:#08795e;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:12px;border-top:1px solid #ffffff20}.side-bottom button{width:100%;background:#ffffff12;color:white;text-align:left}
.main{flex:1;min-width:0;min-height:0;overflow-y:auto;padding:22px clamp(14px,2.4vw,30px) 28px;scrollbar-gutter:stable}.footer{height:48px;flex:0 0 48px;background:linear-gradient(110deg,#00513f,#007553);color:#e8fff6;display:flex;align-items:center;justify-content:space-between;padding:0 5.5%;font-size:11px;border-radius:18% 18% 0 0 / 20% 20% 0 0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:19px;flex-wrap:wrap}.page-head h1{font-size:23px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}.btn-primary{background:var(--green);color:white}.btn-blue{background:var(--blue);color:white}.btn-red{background:var(--red);color:white}.btn-plain{background:#eaf1f6;color:#31516e}.btn-yellow{background:#fff2c4;color:#775900}.btn-sm{padding:6px 9px;font-size:11px;border-radius:7px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel,.card{background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:0 3px 12px #1e52610a}.stat{padding:17px;display:flex;align-items:center;gap:13px}.stat-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px}.stat strong{display:block;font-size:24px;margin-top:3px}.stat span:last-child{font-size:11px;color:var(--muted)}.panel{padding:17px;margin-bottom:17px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel-title h2{font-size:15px;margin:0}.two-col{grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr)}.quick{display:grid;gap:9px}.quick button{text-align:left;color:white}.quick .q1{background:#087c5b}.quick .q2{background:#1479e8}.quick .q3{background:#8a45dd}.quick .q4{background:#63778a}
.chart{height:170px;display:flex;align-items:end;gap:13px;padding:15px 7px 0;border-bottom:1px solid var(--border);background:repeating-linear-gradient(to bottom,#fff 0,#fff 32px,#eaf0f4 33px)}.bar{flex:1;min-width:8px;background:linear-gradient(#54b9ff,#1479e8);border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px;font-size:12px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #e9eff3;white-space:nowrap}th{font-size:11px;color:#587087;background:#f7fafc;font-weight:750}tbody tr:hover{background:#f9fcfd}.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:750}.green{background:#d9f7e9;color:#08764f}.red{background:#ffe0e3;color:#b42332}.yellow{background:#fff0c2;color:#876100}.blue{background:#dcecff;color:#1556a3}.muted{color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px;font-size:12px;font-weight:700}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d6e1e8;border-radius:8px;padding:10px 11px;outline:none;background:white;color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#35a786;box-shadow:0 0 0 3px #14a67816}.field.full{grid-column:1/-1}.field textarea{min-height:78px;resize:vertical}.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar .search{max-width:340px;flex:1}.empty{text-align:center;padding:30px;color:var(--muted)}
.question-builder{border:1px solid var(--border);border-radius:12px;padding:14px;margin:13px 0;background:#fbfdfd}.question-builder h3{margin:0 0 12px;font-size:14px}.option-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.option-box{border:1px solid #d9e5eb;border-radius:9px;padding:9px;background:white;min-width:0}.option-box label{font-size:11px;font-weight:800;display:block;margin-bottom:6px}.option-box input[type=text]{width:100%;border:1px solid #dce6eb;border-radius:6px;padding:8px 6px;font-size:12px}.tf-choice{display:flex;gap:5px;margin-top:8px}.tf-choice button{flex:1;padding:6px 4px;font-size:10px;border:1px solid #d6e2e7;background:#f6f9fa;color:#627789}.tf-choice button.selected-true{background:#d9f7e9;color:#08764f;border-color:#2bb47b}.tf-choice button.selected-false{background:#ffe0e3;color:#b42332;border-color:#ef7b87}.answer-select{border:1px solid #d6e2e7;border-radius:7px;padding:8px;background:white}
.exam-question{border:1px solid var(--border);border-radius:12px;padding:17px;margin-bottom:14px;background:#fff}.exam-question h3{font-size:15px;margin:0 0 14px}.tf-answer-list{display:grid;gap:9px}.tf-answer{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #dce6ec;border-radius:9px;padding:11px}.letter{height:28px;width:28px;border-radius:50%;display:grid;place-items:center;background:#eef4f7;font-size:12px;font-weight:800}.tf-answer button{padding:6px 10px;font-size:11px}.tf-answer.chosen{border-color:#16885f;background:#f0fbf6}.tf-answer.solution-correct{border:2px solid #20a66e;background:#effcf5}.tf-answer.solution-wrong{border:2px solid #dc3545;background:#fff2f3}.tf-answer.solution-unanswered{border:2px solid #e4b422;background:#fff9e6}.notice{padding:11px 13px;border-radius:8px;margin-bottom:10px;font-size:12px;font-weight:750}.notice.correct{background:#d9f7e9;color:#08764f}.notice.wrong{background:#ffe0e3;color:#b42332}.notice.unanswered{background:#fff0c2;color:#876100}.timer{font-weight:800;color:#d92e40;background:#fff0f1;padding:8px 12px;border-radius:9px}.hidden{display:none!important}
.student-mode .sidebar{display:none!important}.student-mode #menuBtn{display:none!important}.student-mode .workspace{display:block}.student-mode .main{width:100%;max-width:none}

.login-screen{min-height:100dvh;background:linear-gradient(180deg,#eaf8f2,#f6f9fb 45%,#fff);display:grid;place-items:center;padding:22px;position:relative;overflow:hidden}.login-screen:before{content:"";position:absolute;left:-10%;right:-10%;top:-30px;height:210px;background:linear-gradient(130deg,#00523f,#078a62);border-radius:0 0 50% 35%;transform:rotate(-2deg)}.login-card{position:relative;z-index:1;width:min(100%,460px);background:#fff;border:1px solid #e4eee9;border-radius:22px;padding:28px;box-shadow:0 18px 55px #064c3b18;margin-top:80px}.login-logo{width:76px;height:76px;margin:-72px auto 16px;background:#fff;border:4px solid #d7f5e7;border-radius:50%;display:grid;place-items:center;color:#007451;font-size:36px;overflow:hidden}.login-logo img{width:100%;height:100%;object-fit:cover}.login-card h1{text-align:center;color:#12345b;font-size:25px;margin:6px 0}.login-card .subtitle{text-align:center;color:#718399;margin-bottom:22px;font-size:13px}.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.role-tabs button{background:#edf5f1;color:#31516e;padding:12px}.role-tabs button.active{background:#087653;color:#fff}.login-error{background:#fff0f1;color:#b42332;border-radius:8px;padding:10px;font-size:12px;margin:10px 0}.student-exam-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;border:1px solid #dce8e2;border-radius:12px;margin:10px 0;background:#fff}.student-exam-card h3{margin:0 0 5px;font-size:15px}.student-exam-card p{margin:0;color:#718399;font-size:12px}.login-footer{position:absolute;z-index:1;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:#5f7582;font-size:11px}.login-footer span:first-child{font-weight:750;color:#087653}.portal-label{font-size:11px;color:#d4fff0;background:#ffffff18;border:1px solid #ffffff44;border-radius:18px;padding:7px 10px}
@media(max-width:900px){.sidebar{width:190px;flex-basis:190px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.option-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.login-footer{bottom:10px;font-size:9px;gap:8px}.login-card{padding:22px}.topbar{height:76px;flex-basis:76px;padding:0 10px;gap:8px;border-radius:0 0 25% 3% / 0 0 12% 5%}.brand{font-size:16px}.brand small{font-size:10px}.brandmark{width:42px;height:42px;font-size:22px}.top-pill{display:none}.sidebar{position:absolute;z-index:4;top:76px;bottom:48px;left:0;box-shadow:10px 0 30px #092d2b33;width:230px;flex-basis:230px}.sidebar.closed{width:0}.main{padding:16px 11px}.stats{gap:9px}.stat{padding:11px;gap:8px}.stat-icon{width:34px;height:34px}.stat strong{font-size:20px}.page-head h1{font-size:20px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.option-grid{grid-template-columns:1fr}.footer{font-size:9px;padding:0 8px}.hide-mobile{display:none}}

.result-page-head{text-align:center;margin:4px 0 18px;padding:18px 12px 14px;background:linear-gradient(135deg,#006449,#07865f);color:#fff;border-radius:14px;box-shadow:0 6px 18px #00644920}.result-brand-title{font-size:22px;font-weight:850;letter-spacing:.4px}.result-brand-sub{font-size:12px;opacity:.92;margin-top:3px}.result-page-head h1{font-size:24px;margin:14px 0 3px;color:#fff}.result-meta{font-size:12px;opacity:.9}.result-sheet{padding:clamp(14px,2.5vw,25px);max-width:1100px;margin:0 auto}.result-student-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-bottom:18px;border-bottom:1px solid var(--border)}.result-student-grid>div{background:#f7fbfa;border:1px solid #e0eee8;border-radius:10px;padding:12px;min-width:0}.result-student-grid span,.result-score span,.count-box span{display:block;color:#648071;font-size:11px;margin-bottom:6px}.result-student-grid strong{font-size:13px;overflow-wrap:anywhere}.result-score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.result-score{background:#f4faf8;border:1px solid #dcefe7;border-radius:12px;padding:17px;text-align:center}.result-score strong{display:block;font-size:25px;color:#075b44}.grade-big{color:#087653!important}.progress{height:7px;border-radius:20px;background:#dcebe5;overflow:hidden;margin-top:10px}.progress i{height:100%;display:block;background:#07845f;border-radius:20px}.result-count-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.count-box{padding:15px;border-radius:11px;border:1px solid;text-align:center}.count-box strong{font-size:24px}.count-correct{background:#effcf5;border-color:#9ce4c5;color:#08764f}.count-wrong{background:#fff1f2;border-color:#ffc4ca;color:#b42332}.count-unanswered{background:#fff9e8;border-color:#f3d887;color:#8b6500}.result-status-line{text-align:center;color:#597082;font-size:13px;margin:20px 0 16px}.result-actions{display:grid;gap:10px}.solution-main-btn{padding:15px;font-size:15px;background:linear-gradient(110deg,#006b4f,#07845f)}.solution-question.correct{border:2px solid #20a66e;background:#f8fffb}.solution-question.wrong{border:2px solid #dc3545;background:#fffafa}.solution-question.unanswered{border:2px solid #e4b422;background:#fffdf4}
@media(max-width:700px){.result-student-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.result-score-grid,.result-count-grid{grid-template-columns:1fr}.result-page-head h1{font-size:20px}.result-brand-title{font-size:19px}}

</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo" id="loginLogo">✚</div>
    <h1 id="loginTitle">SEVEN NURSES</h1><div class="subtitle" id="loginSubtitle">Nursing &amp; Admission Coaching</div>
    <div class="role-tabs"><button id="studentRoleBtn" class="active" onclick="showLoginRole('student')">♙ Student Login</button><button id="adminRoleBtn" onclick="showLoginRole('admin')">⚙ Admin Login</button></div>
    <div id="loginFormArea"></div>
  </div>
  <div class="login-footer">
    <span id="loginFooterText">© 2026 SEVEN NURSES</span>
    <span>Secure Student &amp; Admin Portal</span>
  </div>
</div>
<div class="app hidden" id="appShell">
<header class="topbar">
  <button id="menuBtn" class="close-side" aria-label="Toggle sidebar">☰</button>
  <div class="brandmark" id="headerLogo">✚</div><div class="brand"><span id="headerTitle">SEVEN NURSES</span><small id="headerSubtitle">Nursing &amp; Admission Coaching</small></div>
  <div class="top-spacer"></div><div class="top-pill" id="headerPill">● Admin Panel</div><div class="avatar" id="headerAvatar">A</div><strong id="headerUser" style="font-size:12px">Admin</strong><button class="close-side" onclick="logout()" title="Logout">↪</button>
</header>
<div class="workspace">
<aside class="sidebar" id="sidebar">
  <div class="side-head"><span>Navigation</span><button id="closeBtn" class="close-side" title="Close sidebar">×</button></div>
  <nav class="nav">
    <button class="active" data-page="dashboard" data-role="admin"><span class="ico">▦</span>Dashboard</button>
    <button data-page="students" data-role="admin"><span class="ico">♙</span>Students</button>
    <button data-page="exams" data-role="admin"><span class="ico">▤</span>Exams</button>
    <button data-page="results" data-role="admin"><span class="ico">▥</span>All Exam Results</button>
    <button data-page="history" data-role="admin"><span class="ico">◷</span>History</button>
    <button data-page="solutions" data-role="admin"><span class="ico">✓</span>Solutions</button>
    <button data-page="settings" data-role="admin"><span class="ico">⚙</span>Settings</button>
    <button data-page="studentPortal" data-role="student" class="hidden"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="studentExams" data-role="student" class="hidden"><span class="ico">▤</span>My Exams</button>
    <button data-page="studentResults" data-role="student" class="hidden"><span class="ico">▥</span>My Results</button>
    <button data-page="studentHistory" data-role="student" class="hidden"><span class="ico">◷</span>History</button>
  </nav>

</aside>

</div>
<footer class="footer"><span id="footerTitle">© 2026 SEVEN NURSES</span><span id="footerSubtitle">Nursing &amp; Admission Coaching</span></footer>
</div>
<script>
/*
  FIREBASE INTEGRATION
  --------------------
  Paste your Firebase config into the final production version.
  After you provide the config, the demo login/localStorage authentication
  will be replaced with Firebase Authentication + Firestore security rules.
*/
const $=id=>document.getElementById(id);
let siteConfig=JSON.parse(localStorage.getItem("sn_site_config")||"null")||{title:"SEVEN NURSES",subtitle:"Nursing & Admission Coaching",logo:"",footerText:"© 2026 SEVEN NURSES | Nursing & Admission Coaching"};
function adminEmail(){return window.firebaseCurrentUser?.email||""}
function commonStudentPin(){return window.firebaseAppData?.commonStudentPin||""}
let currentRole=null, loggedStudent=null, loginRole="student", pendingStudentExamId=null;
function saveConfig(){updateBrand();return window.fbSaveAppData?.();}
function updateBrand(){const title=siteConfig.title||"SEVEN NURSES",sub=siteConfig.subtitle||"Nursing & Admission Coaching";["headerTitle","loginTitle"].forEach(id=>{if($(id))$(id).textContent=title});["headerSubtitle","loginSubtitle"].forEach(id=>{if($(id))$(id).textContent=sub});if($("footerTitle"))$("footerTitle").textContent=siteConfig.footerText||("© 2026 "+title+" | "+sub);if($("loginFooterText"))$("loginFooterText").textContent=siteConfig.footerText||("© 2026 "+title+" | "+sub);if($("footerSubtitle"))$("footerSubtitle").textContent="";["headerLogo","loginLogo"].forEach(id=>{const el=$(id);if(el)el.innerHTML=siteConfig.logo?`<img src="${esc(siteConfig.logo)}" alt="Logo">`:"✚"});}
function showLoginRole(role){loginRole=role;$("studentRoleBtn").classList.toggle("active",role==="student");$("adminRoleBtn").classList.toggle("active",role==="admin");const area=$("loginFormArea");if(role==="student"){const published=exams.filter(x=>x.status==="Published");area.innerHTML=`<form id="studentLoginForm" class="grid" onsubmit="studentLogin(event)"><label class="field">তোমার নাম নির্বাচন করো<select name="studentId" required><option value="">স্টুডেন্টের নাম বেছে নাও</option>${students.filter(s=>s.status!=="Inactive").map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></label><label class="field">Common Student PIN<input name="pin" type="password" required inputmode="numeric" placeholder="কমন PIN" autocomplete="current-password"></label><label class="field">Select exam<select name="examId" required><option value="">যে পরীক্ষা দিতে চাও নির্বাচন করো</option>${published.map(x=>`<option value="${x.id}">${esc(x.name)} — ${x.time} মিনিট · ${x.marks} নম্বর</option>`).join("")}</select>${published.length?'<span class="sub">অ্যাডমিন প্রকাশিত পরীক্ষাগুলো এখানে দেখাবে।</span>':'<span class="sub">এখনো কোনো পরীক্ষা প্রকাশ করা হয়নি।</span>'}</label><button class="btn-primary" type="submit" style="padding:13px" ${published.length?'':'disabled'}>Login &amp; Start Selected Exam →</button></form><div class="sub" style="margin-top:10px">সব স্টুডেন্ট একই PIN ব্যবহার করবে। লগইনের পর নির্বাচিত পরীক্ষাটি সরাসরি খুলবে।</div>`}else{area.innerHTML=`<form class="grid" onsubmit="adminLogin(event)"><label class="field">Admin Email<input name="email" type="email" required value="${esc(adminEmail())}" placeholder="Firebase Authentication email" autocomplete="username"></label><label class="field">Admin Password<input name="password" type="password" required placeholder="Admin password" autocomplete="current-password"></label><button class="btn-primary" type="submit" style="padding:13px">Login to Admin Panel →</button></form><div class="sub" style="margin-top:10px">অ্যাডমিন লগইনের জন্য অনুমোদিত Firebase Authentication account ব্যবহার করুন।</div>`}}
async function adminLogin(e){e.preventDefault();const f=new FormData(e.target),email=String(f.get("email")||"").trim(),pass=String(f.get("password")||"");if(!email||!pass){showLoginError("ইমেইল ও পাসওয়ার্ড দিন।");return}try{await window.fbSignIn(email,pass);currentRole="admin";loggedStudent=null;enterApp();}catch(err){showLoginError(window.fbAuthMessage?.(err)||"Admin login ব্যর্থ হয়েছে। ইমেইল ও পাসওয়ার্ড যাচাই করুন।");}}

function collectCurrentQuestions(){let type=$("examType")?.value||examDraft?.type||"True/False";let out=[];for(let i=0;i<questions.length;i++){let text=$(`qtext${i}`)?.value?.trim()||"";let options=["A","B","C","D","E"].map((l,j)=>({label:l,text:$(`q${i}o${j}`)?.value?.trim()||"",truth:truthDraft[`${i}-${j}`]!==undefined?truthDraft[`${i}-${j}`]:(questions[i]?.options?.[j]?.truth??null)}));let correct=type==="MCQ"?Number($(`qcorrect${i}`)?.value??0):null;out.push({text,options,correct,explanation:$(`qexp${i}`)?.value?.trim()||""})}return out}

function deleteHistory(id){if(confirm("History ডিলিট করবেন?")){history=history.filter(h=>h.id!==id);save();render("history")}}
function deleteSelectedHistory(){let ids=[...document.querySelectorAll(".histcheck:checked")].map(x=>Number(x.value));if(!ids.length){alert("আগে history নির্বাচন করুন।");return}if(confirm("নির্বাচিত history ডিলিট করবেন?")){history=history.filter(h=>!ids.includes(h.id));save();render("history")}}
function viewHistory(id){let h=history.find(x=>x.id===id);alert(`${h.exam}\\n${h.datetime}\\nScore: ${h.score}/${h.total}`)}
function solutionsPage(){return `${pageHead("Exam Solutions","পরীক্ষা জমা দেওয়ার পর উত্তর ও সঠিক সমাধান দেখা যাবে।")}
<section class="panel"><div class="toolbar"><select class="search" id="solutionSelect" onchange="showSolution(this.value)"><option value="">একটি সাবমিট করা পরীক্ষা নির্বাচন করুন</option>${solutions.map(s=>`<option value="${s.id}">${esc(s.exam)} — ${esc(s.student)}</option>`).join("")}</select></div><div id="solutionView"><div class="empty">এখানে সাবমিট করা পরীক্ষার বিস্তারিত সলিউশন দেখা যাবে।</div></div></section>`}
function showSolution(id){let s=solutions.find(x=>String(x.id)===String(id));let v=$("solutionView");if(!s){v.innerHTML='<div class="empty">সলিউশন নির্বাচন করুন।</div>';return}v.innerHTML=`<div class="panel-title"><h2>${esc(s.exam)} — ${esc(s.student)}</h2><span class="badge blue">Score ${s.score}/${s.total}</span></div>${s.questions.map((q,i)=>{let unanswered=s.type==="MCQ"?(q.answer===undefined||q.answer===null):q.optionAnswers.every(a=>a===undefined||a===null);let correct=s.type==="MCQ"?(q.answer===q.correctAnswer):q.optionAnswers.every((a,j)=>a===q.options[j].truth);let cls=unanswered?"unanswered":correct?"correct":"wrong";let label=unanswered?"আপনার উত্তর দেওয়া হয়নি":correct?"আপনার উত্তরটি সঠিক হয়েছে":"আপনার উত্তরটি ভুল";return `<div class="exam-question"><div class="notice ${cls}">${label}</div><h3>Q${i+1}. ${esc(q.text)}</h3>${q.options.map((o,j)=>{let selected=s.type==="MCQ"?q.answer===j:q.optionAnswers[j]!==undefined&&q.optionAnswers[j]!==null;let right=s.type==="MCQ"?q.correctAnswer===j:q.options[j].truth===true;let tfAnswer=s.type==="True/False"?q.optionAnswers[j]:null;let optionCls=s.type==="True/False"?(tfAnswer===undefined||tfAnswer===null?"solution-unanswered":tfAnswer===o.truth?"solution-correct":"solution-wrong"):(right?"solution-correct":selected&&!right?"solution-wrong":"");return `<div class="tf-answer ${optionCls}"><span class="letter">${o.label}</span><span>${esc(o.text)} <small class="muted">${s.type==="True/False"?"· Correct: "+(o.truth?"True":"False"):""}</small></span><span>${s.type==="True/False"?(tfAnswer===undefined||tfAnswer===null?'<span class="badge yellow">Not answered</span>':`<span class="badge ${tfAnswer===o.truth?"green":"red"}">Your answer: ${tfAnswer?"True":"False"}</span>`):(right?'<span class="badge green">✓ Correct answer</span>':selected?'<span class="badge red">Your answer</span>':"")}</span></div>`}).join("")}<p class="sub">ব্যাখ্যা: ${esc(q.explanation||"কোনো ব্যাখ্যা যোগ করা হয়নি।")}</p></div>`}).join("")}`}
function settingsPage(){return `${pageHead("Website Settings","ওয়েবসাইটের পরিচিতি, ফুটার, স্টুডেন্ট PIN ও অ্যাডমিন সেটিংস পরিবর্তন করুন।")}
<section class="panel"><div class="panel-title"><h2>Website Branding</h2><span class="badge green">Header &amp; Footer</span></div><form class="form-grid" onsubmit="saveBrandSettings(event)"><label class="field">Website Title *<input name="title" required value="${esc(siteConfig.title)}" placeholder="SEVEN NURSES"></label><label class="field">Website Subtitle *<input name="subtitle" required value="${esc(siteConfig.subtitle)}" placeholder="Nursing & Admission Coaching"></label><label class="field full">Logo Image URL (optional)<input name="logo" type="url" value="${esc(siteConfig.logo)}" placeholder="https://example.com/logo.png"><span class="sub">সরাসরি ইমেজ URL দিন। খালি রাখলে ✚ লোগো দেখাবে।</span></label><label class="field full">Footer Text *<input name="footerText" required value="${esc(siteConfig.footerText||("© 2026 "+siteConfig.title+" | "+siteConfig.subtitle))}" placeholder="ফুটারে যে লেখা দেখাতে চাও"></label><div class="field full"><button class="btn-primary" type="submit">Save Website Design</button></div></form></section>
<section class="panel"><div class="panel-title"><h2>Common Student PIN</h2><span class="badge yellow">All students share one PIN</span></div><form class="form-grid" onsubmit="changeStudentPin(event)"><label class="field">New Common PIN *<input name="pin" type="password" required minlength="4" maxlength="12" inputmode="numeric" placeholder="কমপক্ষে ৪ অক্ষর/সংখ্যা"></label><label class="field">Confirm PIN *<input name="confirm" type="password" required minlength="4" maxlength="12" inputmode="numeric" placeholder="আবার PIN লিখুন"></label><div class="field full"><button class="btn-primary" type="submit">Update Student PIN</button></div></form><p class="sub">স্টুডেন্ট PIN সব স্টুডেন্টের জন্য একই হবে। Production version-এ PIN server-side/Firebase rules দিয়ে যাচাই করা হবে।</p></section>
<section class="panel"><div class="panel-title"><h2>Admin Account</h2><span class="badge green">Firebase Authentication</span></div><div class="field full"><label>Authenticated Admin Email</label><input value="${esc(adminEmail())}" readonly style="background:#f5f8fa"><span class="sub">এই ইমেইলটি Firebase Authentication-এর বর্তমান লগইন করা অ্যাডমিন account থেকে নেওয়া হয়েছে।</span></div><form class="form-grid" style="margin-top:16px" onsubmit="changeAdminPassword(event)"><label class="field">Current Password *<input type="password" name="current" required autocomplete="current-password"></label><label class="field">New Password *<input type="password" name="next" required minlength="6" autocomplete="new-password" placeholder="কমপক্ষে ৬ অক্ষর"></label><label class="field full">Confirm New Password *<input type="password" name="confirm" required minlength="6" autocomplete="new-password"></label><div class="field full"><button class="btn-primary" type="submit">Update Admin Password</button></div></form><p class="sub">পাসওয়ার্ড পরিবর্তনের আগে Firebase নিরাপত্তার জন্য বর্তমান পাসওয়ার্ড যাচাই করবে।</p></section>
<section class="panel"><h2 style="margin-top:0">Database &amp; Privacy</h2><p class="sub">এই সংস্করণে Firebase Realtime Database-এর <b>appData</b> node ব্যবহার করা হয়েছে। Student UI শুধু নিজের result filter করে। Production-level read isolation চাইলে results/students/exams আলাদা paths এবং Firebase Rules/Backend authorization প্রয়োজন।</p></section><section class="panel"><h2 style="margin-top:0">Demo Data</h2><p class="sub">এই ফাইলের তথ্য একই ব্রাউজারে সংরক্ষিত হয়; অন্য ডিভাইস বা স্টুডেন্টদের সঙ্গে স্বয়ংক্রিয়ভাবে সিঙ্ক হয় না।</p><div class="inline"><button class="btn-plain" onclick="save()">Save current data</button><button class="btn-red" onclick="resetDemo()">Reset demo data</button></div></section>`}
async function saveBrandSettings(e){e.preventDefault();const f=new FormData(e.target);siteConfig={...siteConfig,title:f.get("title").trim(),subtitle:f.get("subtitle").trim(),logo:f.get("logo").trim(),footerText:f.get("footerText").trim()};try{await saveConfig();alert("Website title, subtitle, logo ও footer text সংরক্ষণ হয়েছে।");render("settings")}catch(err){alert("Settings save failed: "+err.message)}}
async function changeStudentPin(e){e.preventDefault();const f=new FormData(e.target),pin=String(f.get("pin")||""),confirmPin=String(f.get("confirm")||"");if(pin!==confirmPin){alert("দুটি PIN মেলেনি।");return}if(!/^\d{4,12}$/.test(pin)){alert("PIN ৪ থেকে ১২ সংখ্যার হতে হবে।");return}window.firebaseAppData.commonStudentPin=pin;try{await save();alert("Common Student PIN পরিবর্তন হয়েছে।");e.target.reset();render("settings")}catch(err){alert("PIN save failed: "+err.message)}}
async function changeAdminPassword(e){e.preventDefault();const f=new FormData(e.target),old=String(f.get("current")||""),next=String(f.get("next")||""),confirmPass=String(f.get("confirm")||"");if(next!==confirmPass){alert("নতুন পাসওয়ার্ড ও Confirm Password মিলছে না।");return}if(next.length<8){alert("নতুন পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।");return}try{await window.fbChangePassword(old,next);alert("Admin password সফলভাবে পরিবর্তন হয়েছে।");e.target.reset();}catch(err){alert(window.fbAuthMessage?.(err)||"পাসওয়ার্ড পরিবর্তন করা যায়নি। আবার চেষ্টা করুন।");}}
let lastStudentResultId=null,lastStudentSolutionId=null;
function renderStudentPortal(which="studentPortal"){const main=$("main");main.dataset.page=which;const mine=results.filter(r=>r.studentId!=null?String(r.studentId)===String(loggedStudent?.id):r.student===(loggedStudent?.name||""));const available=exams.filter(e=>e.status==="Published");main.innerHTML=`${pageHead(`স্বাগতম, ${esc(loggedStudent?.name||"Student")}`,"SEVEN NURSES — তোমার পরীক্ষা ও ফলাফল এখানে দেখো।")}<section class="panel"><div class="panel-title"><h2>Available Exams</h2><span class="badge green">${available.length} Published</span></div>${available.map(e=>`<div class="student-exam-card"><div><h3>${esc(e.name)}</h3><p>${esc(e.type)} · ${e.time} মিনিট · ${e.marks} নম্বর · ${e.questions?.length||e.questionCount||0} প্রশ্ন</p></div><button class="btn-primary" onclick="startExam(${e.id})">Start Exam →</button></div>`).join("")||'<div class="empty">এখনও কোনো পরীক্ষা প্রকাশ করা হয়নি।</div>'}</section><section class="panel"><div class="panel-title"><h2>Recent Results</h2><button class="btn-plain btn-sm" onclick="go('studentResults')">সব ফলাফল দেখো →</button></div>${mine.length?`<div class="table-wrap"><table><thead><tr><th>Exam</th><th>Score</th><th>Grade</th><th>Date</th><th>Action</th></tr></thead><tbody>${mine.slice(0,5).map(r=>`<tr><td>${esc(r.exam)}</td><td>${r.score}/${r.total}</td><td><span class="badge ${r.grade==="F"?"red":"green"}">${esc(r.grade)}</span></td><td>${esc(r.datetime)}</td><td><button class="btn-primary btn-sm" onclick="openStudentResult(${r.id})">View Result</button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">এখনও কোনো ফলাফল নেই। পরীক্ষা শেষ করে Submit করলে এখানে ফলাফল দেখাবে।</div>'}</section>`;}
function renderStudentResults(){const mine=results.filter(r=>r.studentId!=null?String(r.studentId)===String(loggedStudent?.id):r.student===(loggedStudent?.name||""));$("main").dataset.page="studentResults";$("main").innerHTML=`${pageHead("আমার পরীক্ষার ফলাফল","প্রতিটি পরীক্ষার নম্বর, শতাংশ, গ্রেড ও অবস্থান দেখো।")}<section class="panel">${mine.length?`<div class="table-wrap"><table><thead><tr><th>Exam Name</th><th>Score</th><th>Percentage</th><th>Grade</th><th>Correct</th><th>Wrong</th><th>Unanswered</th><th>Date</th><th>Action</th></tr></thead><tbody>${mine.map(r=>`<tr><td>${esc(r.exam)}</td><td>${r.score}/${r.total}</td><td>${r.percentage??Math.round(r.score/Math.max(1,r.total)*100)}%</td><td><span class="badge ${r.grade==="F"?"red":"green"}">${esc(r.grade)}</span></td><td>${r.correctCount??"—"}</td><td>${r.wrongCount??"—"}</td><td>${r.unansweredCount??"—"}</td><td>${esc(r.datetime)}</td><td><button class="btn-primary btn-sm" onclick="openStudentResult(${r.id})">View Result</button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">এখনও কোনো ফলাফল নেই।</div>'}</section>`;}
function renderStudentHistory(){const mine=history.filter(h=>h.studentId!=null?String(h.studentId)===String(loggedStudent?.id):h.student===(loggedStudent?.name||""));$("main").dataset.page="studentHistory";$("main").innerHTML=`${pageHead("আমার পরীক্ষা History","তোমার জমা দেওয়া পরীক্ষার ইতিহাস।")}<section class="panel">${mine.length?`<div class="table-wrap"><table><thead><tr><th>Exam</th><th>Date & Time</th><th>Score</th><th>Status</th></tr></thead><tbody>${mine.map(h=>`<tr><td>${esc(h.exam)}</td><td>${esc(h.datetime)}</td><td>${h.score}/${h.total}</td><td><span class="badge green">${esc(h.status||"Completed")}</span></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">এখনও কোনো history নেই।</div>'}</section>`;}
function openStudentResult(id){const r=results.find(x=>x.id===id&&(x.studentId!=null?String(x.studentId)===String(loggedStudent?.id):x.student===(loggedStudent?.name||"")));if(!r)return;lastStudentResultId=id;const sol=solutions.find(x=>x.resultId===id&&(x.studentId==null||String(x.studentId)===String(loggedStudent?.id)));lastStudentSolutionId=sol?.id||null;renderStudentResult(r,sol);}
function renderStudentResult(r,sol){const pct=Number(r.percentage??Math.round(r.score/Math.max(1,r.total)*100));const main=$("main");main.dataset.page="studentResult";main.innerHTML=`<div class="result-page-head"><h1>${esc(r.exam)}</h1><div class="result-brand-title">${esc(siteConfig.title||"SEVEN NURSES")}</div><div class="result-brand-sub">${esc(siteConfig.subtitle||"Nursing & Admission Coaching")}</div><div class="result-meta">পরীক্ষার ফলাফল</div></div><section class="panel result-sheet"><div class="result-student-grid"><div><span>Student Name</span><strong>${esc(r.student)}</strong></div><div><span>Student ID</span><strong>${esc((students.find(s=>s.name===r.student)||{}).sid||"—")}</strong></div><div><span>Exam Date & Time</span><strong>${esc(r.datetime)}</strong></div><div><span>Position / Rank</span><strong>${r.position??r.rank??"—"}</strong></div></div><div class="result-score-grid"><div class="result-score"><span>প্রাপ্ত নম্বর</span><strong>${r.score} / ${r.total}</strong></div><div class="result-score"><span>শতকরা</span><strong>${pct}%</strong><div class="progress"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></div></div><div class="result-score"><span>Grade</span><strong class="grade-big">${esc(r.grade)}</strong></div></div><div class="result-count-grid"><div class="count-box count-correct"><span>সঠিক উত্তর</span><strong>${r.correctCount??"—"}</strong></div><div class="count-box count-wrong"><span>ভুল উত্তর</span><strong>${r.wrongCount??"—"}</strong></div><div class="count-box count-unanswered"><span>উত্তর দেওয়া হয়নি</span><strong>${r.unansweredCount??"—"}</strong></div></div><div class="result-status-line">${pct>=80?"চমৎকার ফলাফল!":pct>=50?"ভালো চেষ্টা—আরও অনুশীলন করো।":"অনুশীলন চালিয়ে যাও, তুমি আরও ভালো করতে পারবে।"}</div><div class="result-actions"><button class="btn-primary solution-main-btn" ${sol?`onclick="lastStudentSolutionId=${sol.id};go('studentSolution')"`:"disabled"}>✓ &nbsp; Solution দেখো →</button><button class="btn-plain" onclick="go('studentResults')">ফলাফলে ফিরে যাও</button></div></section>`;}
function renderStudentSolution(id){const s=solutions.find(x=>String(x.id)===String(id)&&(currentRole!=="student"||(x.studentId!=null?String(x.studentId)===String(loggedStudent?.id):x.student===(loggedStudent?.name||""))));const main=$("main");main.dataset.page="studentSolution";if(!s){main.innerHTML=`${pageHead("Solution","এই ফলাফলের সলিউশন পাওয়া যায়নি।")}<button class="btn-plain" onclick="go('studentResults')">ফলাফলে ফিরে যাও</button>`;return}main.innerHTML=`${pageHead(s.exam,"সঠিক উত্তর সবুজ, ভুল উত্তর লাল এবং উত্তর না দেওয়া হলুদ রঙে দেখানো হয়েছে।",`<button class="btn-plain" onclick="openStudentResult(${lastStudentResultId})">← Result-এ ফিরে যাও</button>`)}<section class="panel"><div class="panel-title"><h2>${esc(s.exam)} — ${esc(s.student)}</h2><span class="badge blue">Score ${s.score}/${s.total}</span></div>${s.questions.map((q,i)=>{const unanswered=s.type==="MCQ"?(q.answer===undefined||q.answer===null):q.optionAnswers.every(a=>a===undefined||a===null);const correct=s.type==="MCQ"?(q.answer===q.correctAnswer):q.optionAnswers.every((a,j)=>a===q.options[j].truth);const cls=unanswered?"unanswered":correct?"correct":"wrong";const label=unanswered?"উত্তর দেওয়া হয়নি":correct?"সঠিক উত্তর":"ভুল উত্তর";return `<div class="exam-question solution-question ${cls}"><div class="notice ${cls}">${label}${!correct&&s.type==="MCQ"?` · সঠিক উত্তর: ${q.options[q.correctAnswer]?.label||"—"}`:""}</div><h3>প্রশ্ন ${i+1}. ${esc(q.text)}</h3>${q.options.map((o,j)=>{const selected=s.type==="MCQ"?q.answer===j:q.optionAnswers[j]!==undefined&&q.optionAnswers[j]!==null;const right=s.type==="MCQ"?q.correctAnswer===j:q.options[j].truth===true;const tfAnswer=s.type==="True/False"?q.optionAnswers[j]:null;const optionCls=s.type==="True/False"?(tfAnswer===undefined||tfAnswer===null?"solution-unanswered":tfAnswer===o.truth?"solution-correct":"solution-wrong"):(right?"solution-correct":selected&&!right?"solution-wrong":"");return `<div class="tf-answer ${optionCls}"><span class="letter">${esc(o.label)}</span><span>${esc(o.text)} ${s.type==="True/False"?`<small class="muted">· সঠিক: ${o.truth?"True":"False"}</small>`:""}</span><span>${s.type==="True/False"?(tfAnswer===undefined||tfAnswer===null?'<span class="badge yellow">উত্তর দেওয়া হয়নি</span>':`<span class="badge ${tfAnswer===o.truth?"green":"red"}">তোমার উত্তর: ${tfAnswer?"True":"False"}</span>`):(right?'<span class="badge green">✓ সঠিক উত্তর</span>':selected?'<span class="badge red">তোমার উত্তর</span>':"")}</span></div>`}).join("")}<p class="sub">ব্যাখ্যা: ${esc(q.explanation||"কোনো ব্যাখ্যা যোগ করা হয়নি।")}</p></div>`}).join("")}</section>`;}
function startExam(id){let e=exams.find(x=>x.id===id);if(!e)return;if(currentRole==="student"&&e.status!=="Published"){alert("এই পরীক্ষা প্রকাশিত নয়।");return}if(!e.questions?.length){alert("এই পরীক্ষায় এখনো প্রশ্ন যোগ করা হয়নি। Edit করে প্রশ্ন যোগ করুন।");return}activeExam=e;examAnswers={};secondsLeft=e.time*60;go("takeExam");startTimer()}
function startTimer(){clearInterval(examInterval);examInterval=setInterval(()=>{if(!activeExam){clearInterval(examInterval);return}secondsLeft--;let el=$("timerLive");if(el)el.textContent=formatTime(secondsLeft);if(secondsLeft<=0){clearInterval(examInterval);submitExam(true)}},1000)}
function formatTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function takeExamPage(){if(!activeExam)return `${pageHead("Take Exam","কোনো পরীক্ষা নির্বাচন করা হয়নি।")}<button class="btn-primary" onclick="go('exams')">ফিরে যান</button>`;return `${pageHead(activeExam.name,"পরীক্ষা চলাকালীন সঠিক উত্তর দেখানো হবে না।",`<span class="timer">◷ <span id="timerLive">${formatTime(secondsLeft)}</span></span>`)}
<div class="panel"><div class="panel-title"><h2>${esc(activeExam.name)}</h2><span class="badge blue">${activeExam.type} · ${activeExam.marks} marks</span></div><p class="sub">শিক্ষার্থী: ${esc(loggedStudent?.name||(students[0]?.name||"Demo Student"))} · প্রশ্ন ${activeExam.questions.length}টি</p>${activeExam.questions.map((q,i)=>`<div class="exam-question"><h3>Q${i+1}. ${esc(q.text)}</h3>${activeExam.type==="MCQ"?`<div class="tf-answer-list">${q.options.map((o,j)=>`<label class="tf-answer ${examAnswers[i]===j?"chosen":""}"><span class="letter">${o.label}</span><span>${esc(o.text)}</span><input type="radio" name="ans${i}" ${examAnswers[i]===j?"checked":""} onchange="examAnswers[${i}]=${j};renderTakeAnswers()" style="accent-color:#087c5b"></label>`).join("")}</div>`:`<div class="tf-answer-list">${q.options.map((o,j)=>`<div class="tf-answer ${examAnswers[`${i}-${j}`]===true?"chosen":""}"><span class="letter">${o.label}</span><span>${esc(o.text)}</span><div class="inline"><button class="btn-sm ${examAnswers[`${i}-${j}`]===true?"btn-primary":"btn-plain"}" onclick="examAnswers['${i}-${j}']=true;renderTakeAnswers()">True</button><button class="btn-sm ${examAnswers[`${i}-${j}`]===false?"btn-red":"btn-plain"}" onclick="examAnswers['${i}-${j}']=false;renderTakeAnswers()">False</button></div></div>`).join("")}</div>`}</div>`).join("")}<div class="inline"><button class="btn-primary" onclick="submitExam(false)">Submit Exam</button><button class="btn-plain" onclick="if(confirm('পরীক্ষা থেকে বের হবেন? উত্তর জমা হবে না।')){clearInterval(examInterval);activeExam=null;go('exams')}">Exit</button></div></div>`}
function renderTakeAnswers(){let y=$("main").scrollTop;$("main").innerHTML=takeExamPage();$("main").scrollTop=y}
function submitExam(auto){if(!activeExam)return;if(!auto&&!confirm("পরীক্ষা জমা দেবেন? জমা দেওয়ার পর উত্তর পরিবর্তন করা যাবে না।"))return;clearInterval(examInterval);const e=activeExam;let detail=[];e.questions.forEach((q,i)=>{const answer=e.type==="MCQ"?examAnswers[i]:undefined;const correctAnswer=e.type==="MCQ"?q.correct:undefined;detail.push({text:q.text,options:q.options,answer,correctAnswer,explanation:q.explanation,optionAnswers:e.type==="True/False"?q.options.map((o,j)=>examAnswers[`${i}-${j}`]===undefined?null:examAnswers[`${i}-${j}`]):[]})});let score=0,total=e.type==="MCQ"?e.questions.length:e.questions.length*5,correctCount=0,wrongCount=0,unansweredCount=0;if(e.type==="MCQ"){detail.forEach(q=>{if(q.answer===undefined||q.answer===null)unansweredCount++;else if(q.answer===q.correctAnswer){correctCount++;score++}else{wrongCount++}})}else{detail.forEach(q=>{q.answer=q.optionAnswers.reduce((n,a,j)=>n+(a===q.options[j].truth?1:0),0);q.correctAnswer=5;score+=q.answer;q.optionAnswers.forEach((a,j)=>{if(a===undefined||a===null)unansweredCount++;else if(a===q.options[j].truth)correctCount++;else wrongCount++})});total=e.questions.length*5}const pct=Math.round(score/Math.max(1,total)*100);const grade=pct>=80?"A+":pct>=70?"A":pct>=60?"B":pct>=50?"C":"F";const student=loggedStudent?.name||(students[0]?.name||"Demo Student");const sameExam=results.filter(x=>x.exam===e.name);const better=sameExam.filter(x=>(Number(x.percentage??(x.score/Math.max(1,x.total)*100)))>pct).length;const r={id:Date.now(),exam:e.name,student,studentId:loggedStudent?.id??null,position:better+1,rank:better+1,grade,score,total,percentage:pct,correctCount,wrongCount,unansweredCount,datetime:now(),status:pct>=50?"Passed":"Needs Improvement"};results.unshift(r);const solId=Date.now()+2;history.unshift({id:Date.now()+1,exam:e.name,student,studentId:loggedStudent?.id??null,datetime:r.datetime,score,total,status:auto?"Auto-submitted":"Completed",pinned:false,resultId:r.id});solutions.unshift({id:solId,resultId:r.id,exam:e.name,student,studentId:loggedStudent?.id??null,type:e.type,score,total,questions:detail});save();activeExam=null;if(currentRole==="student"){lastStudentResultId=r.id;lastStudentSolutionId=solId;renderStudentResult(r,solutions[0]);document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));alert(auto?"সময় শেষ! পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হয়েছে। ফলাফল দেখো।":"পরীক্ষা জমা হয়েছে। তোমার ফলাফল দেখো।")}else{render("solutions");if($("solutionSelect"))$("solutionSelect").value=String(solutions[0].id);showSolution(solutions[0].id);alert(auto?"সময় শেষ! পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হয়েছে।":"পরীক্ষা জমা হয়েছে। এখন সলিউশন দেখতে পারবেন।")}}
function go(p){if(p==="takeExam"){$("main").innerHTML=takeExamPage();document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));return}if(p==="studentPortal"||p==="studentExams"){renderStudentPortal(p);document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));return}if(p==="studentResults"){renderStudentResults();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));return}if(p==="studentHistory"){renderStudentHistory();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));return}if(p==="studentSolution"){renderStudentSolution(lastStudentSolutionId);document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));return}render(p)}
$("menuBtn").addEventListener("click",()=>$("sidebar").classList.toggle("closed"));
$("closeBtn").addEventListener("click",()=>$("sidebar").classList.add("closed"));
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{if(activeExam&&b.dataset.page!=="takeExam"){if(!confirm("চলমান পরীক্ষা থেকে বের হলে পরীক্ষা জমা হবে না। যাবেন?"))return;clearInterval(examInterval);activeExam=null}go(b.dataset.page);if(innerWidth<=600)$("sidebar").classList.add("closed")}));
$("sidebarHelp").addEventListener("click",()=>alert("এটি একটি local demo। তথ্য এই browser-এর localStorage-এ সংরক্ষিত হয়; production-এর জন্য Firebase/backend লাগবে."));
function resetDemo(){alert("Production version-এ demo reset বন্ধ রাখা হয়েছে। Firebase Database-এর ডেটা মুছতে Firebase Console ব্যবহার করুন.")}
async function bootstrap(){try{await window.firebaseReady;await window.fbLoadAppData();updateBrand();showLoginRole("student");const user=window.firebaseCurrentUser;if(user){currentRole="admin";loggedStudent=null;enterApp();}}catch(err){console.error(err);updateBrand();showLoginRole("student");showLoginError("Firebase data load করা যায়নি। Firebase configuration ও Realtime Database rules যাচাই করুন।");}}
window.addEventListener("DOMContentLoaded",bootstrap);
</script>

function safeData(d){d=d||{};return{siteConfig:d.siteConfig||{title:"SEVEN NURSES",subtitle:"Nursing & Admission Coaching",logo:"",footerText:"© 2026 SEVEN NURSES | Nursing & Admission Coaching"},commonStudentPin:d.commonStudentPin||"",students:Array.isArray(d.students)?d.students:[],exams:Array.isArray(d.exams)?d.exams:[],results:Array.isArray(d.results)?d.results:[],history:Array.isArray(d.history)?d.history:[],solutions:Array.isArray(d.solutions)?d.solutions:[]}}
